<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account · RoleReady</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=6">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="login-page">

    <div id="login-container">

        <header class="login-header">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="4" width="16" height="16" rx="2"/>
                    <rect x="9" y="9" width="6" height="6"/>
                    <path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/>
                </svg>
                <span>RoleReady</span>
            </div>
            <p class="login-subtitle">Create your candidate profile to practice autonomous, adaptive technical mock interviews.</p>
        </header>

        <div class="login-form">
            <div class="term-chrome" style="margin: -24px -24px 20px; border-radius: 18px 18px 0 0;">
                <div class="term-dots"><span class="term-dot"></span><span class="term-dot"></span><span class="term-dot"></span></div>
                <div class="term-tab">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                    <span>New Candidate Registration</span>
                </div>
                <div class="term-live"><span class="term-live-dot"></span>Secure</div>
            </div>

            <div class="form-group">
                <label for="fullName">Full Name <span class="optional-tag">(optional)</span></label>
                <input
                    id="fullName"
                    type="text"
                    placeholder="Jane Doe"
                    autocomplete="name"
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    id="email"
                    type="email"
                    placeholder="candidate@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    id="password"
                    type="password"
                    placeholder="••••••••••••"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    id="confirmPassword"
                    type="password"
                    placeholder="••••••••••••"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="login-buttons">
                <button id="signupBtn" class="btn-primary" style="flex: 1;" onclick="handleSignUp()">
                    <span>Create Free Account</span>
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                </button>
            </div>

            <p class="auth-switch-link">
                Already have an account? <a href="/">Sign in</a>
            </p>

            <p id="authMsg" style="display:none;"></p>

        </div>

    </div>

    <script src="/static/config.js"></script>
    <script src="/static/auth.js"></script>
    <script src="/static/signup.js"></script>

    <script>
        // Allow pressing Enter key in inputs to submit the form
        document.querySelectorAll("#fullName, #email, #password, #confirmPassword").forEach(el => {
            el.addEventListener("keydown", (e) => {
                if (e.key === "Enter") handleSignUp();
            });
        });
    </script>

</body>
</html>
