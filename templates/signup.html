<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up · RoleReady</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="/static/style.css?v=4">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="login-page">

    <div id="login-container">

        <header class="login-header">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="4" width="16" height="16" rx="2"/>
                    <rect x="9" y="9" width="6" height="6"/>
                    <path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/>
                </svg>
                <span>RoleReady</span>
            </div>
            <p class="login-subtitle">Create an account to start practicing anonymous, adaptive mock interviews.</p>
        </header>

        <div class="login-form">
            <div class="term-chrome" style="margin: -32px -32px 24px; border-radius: 16px 16px 0 0;">
                <div class="term-dots"><span class="term-dot"></span><span class="term-dot"></span><span class="term-dot"></span></div>
                <div class="term-tab">new_session.sh</div>
                <div class="term-live"><span class="term-live-dot"></span>init</div>
            </div>

            <div class="form-group">
                <label for="fullName">Full name <span class="optional-tag">(optional)</span></label>
                <input
                    id="fullName"
                    type="text"
                    placeholder="Jane Doe"
                    autocomplete="name"
                >
            </div>

            <div class="form-group">
                <label for="email">Email address</label>
                <input
                    id="email"
                    type="email"
                    placeholder="candidate@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    id="password"
                    type="password"
                    placeholder="••••••••••••"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm password</label>
                <input
                    id="confirmPassword"
                    type="password"
                    placeholder="••••••••••••"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="login-buttons">
                <button id="signupBtn" class="btn-primary" style="flex: 1;" onclick="handleSignUp()">
                    Create Account
                </button>
            </div>

            <p class="auth-switch-link">
                Already have an account? <a href="/">Log in</a>
            </p>

            <p id="authMsg" style="display:none; font-size: 0.85rem; margin-top: 12px; text-align: center;"></p>

        </div>

    </div>

    <script src="/static/config.js"></script>
    <script src="/static/auth.js"></script>
    <script src="/static/signup.js"></script>

    <script>
        // Allow pressing Enter key in inputs to submit the form
        document.querySelectorAll("#fullName, #email, #password, #confirmPassword").forEach(el => {
            el.addEventListener("keydown", (e) => {
                if (e.key === "Enter") handleSignUp();
            });
        });
    </script>

</body>
</html>
