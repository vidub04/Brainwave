<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · RoleReady Adaptive Mock Interviews</title>
    <link rel="stylesheet" href="/static/style.css?v=3">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="login-page">

    <div id="login-container">

        <header class="login-header">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="4" width="16" height="16" rx="2"/>
                    <rect x="9" y="9" width="6" height="6"/>
                    <path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/>
                </svg>
                <span>RoleReady</span>
            </div>
            <p class="login-subtitle">Sign in or create an account to practice adaptive AI mock interviews</p>
        </header>

        <div class="login-form">

            <div class="form-group">
                <label for="email">Email address</label>
                <input
                    id="email"
                    type="email"
                    placeholder="candidate@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    id="password"
                    type="password"
                    placeholder="••••••••••••"
                    autocomplete="current-password"
                    required
                >
            </div>

            <div class="login-buttons">
                <button class="btn-primary" onclick="signIn()">
                    Log In
                </button>

                <button class="btn-secondary" onclick="signUp()">
                    Sign Up (Instant Auto-Verify)
                </button>
            </div>

            <div class="divider-row">
                <span>OR</span>
            </div>

            <button class="btn-demo-access" onclick="quickDemoLogin()">
                ⚡ 1-Click Candidate Demo Access
            </button>

            <p id="authMsg" style="display:none; font-size: 0.85rem; margin-top: 12px; text-align: center;"></p>

        </div>

    </div>

    <script src="/static/config.js"></script>
    <script src="/static/auth.js"></script>

    <script>
        // Allow pressing Enter key in inputs to log in
        document.querySelectorAll("#email, #password").forEach(el => {
            el.addEventListener("keydown", (e) => {
                if (e.key === "Enter") signIn();
            });
        });
    </script>

</body>
</html>
