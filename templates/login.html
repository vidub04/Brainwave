<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · RoleReady</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container" style="width:400px; height:auto; padding:32px;">

    <header style="border:none; margin-bottom:24px;">
        <div class="logo">🤖 RoleReady</div>
    </header>

    <div style="display:flex; flex-direction:column; gap:12px;">
        <input id="email" type="email" placeholder="Email"
               style="padding:10px; border-radius:8px; border:1px solid #374151; background:#111827; color:white;">
        <input id="password" type="password" placeholder="Password"
               style="padding:10px; border-radius:8px; border:1px solid #374151; background:#111827; color:white;">

        <div style="display:flex; gap:8px;">
            <button onclick="signIn()" style="flex:1; padding:10px; border-radius:8px; border:none; background:#2563eb; color:white; cursor:pointer;">Log In</button>
            <button onclick="signUp()" style="flex:1; padding:10px; border-radius:8px; border:none; background:#374151; color:white; cursor:pointer;">Sign Up</button>
        </div>

        <p id="authMsg" style="color:#f87171; font-size:14px; min-height:20px;"></p>
    </div>

</div>

<script src="/static/config.js"></script>
<script src="/static/auth.js"></script>
</body>
</html>
