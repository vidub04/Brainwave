<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Brainwave</title>

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- Landing Page -->

<section id="landing" class="landing">

    <div class="hero">

        <div class="logo-circle">
            🧠
        </div>

        <h1>Interview Brainwave</h1>

        <p>
            Practice realistic AI-powered mock interviews with
            technical and HR interviewers.
        </p>

        <br>
        <br>
        <br>

        <button id="startBtn">
            🚀 Let's Begin Interview
        </button>

    </div>

</section>



<!-- Interview Screen -->

<section id="interview" class="hidden">

<header>

    <h2>Interview Brainwave</h2>

    <div class="status">

        <span id="questionNo">
            Question 1 / 11
        </span>

        <span>
            ⏱️ <span id="timer">00:00</span>
        </span>

    </div>

</header>


<div class="chat-box" id="chatBox">

    <div class="message bot">

        <div class="avatar">
            🤖
        </div>

        <div class="bubble">
            Welcome to Interview Brainwave!

            Please introduce yourself and tell me the role you're applying for.
        </div>

    </div>

</div>


<div class="input-area">

    <textarea
            id="prompt"
            placeholder="Type your answer..."
    ></textarea>

    <button onclick="sendPrompt()">
        Send
    </button>

</div>

</section>


<script src="/static/script.js"></script>

</body>
</html>
